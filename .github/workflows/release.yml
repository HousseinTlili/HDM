name: Release builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev rpm
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: |
          npm ci --prefix hdm-ui
          npm ci --prefix app
          npm ci --prefix extension
      - name: Build extension
        run: npm run build --prefix extension
      - name: Build sidecar
        run: node scripts/build-sidecar.mjs --target ${{ matrix.target }}
      - name: Build app
        working-directory: app
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "1"
        shell: bash
        run: |
          npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: DMG with the browser extension next to the app (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          B=target/${{ matrix.target }}/release/bundle
          DMG=$(ls "$B"/dmg/*.dmg)
          STAGE=$(mktemp -d)/HDM
          mkdir -p "$STAGE/Browser Extension"
          cp -R "$B/macos/HDM.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          cp -R extension/build/chromium "$STAGE/Browser Extension/Chrome, Edge, Brave"
          cp -R extension/build/firefox "$STAGE/Browser Extension/Firefox"
          cp packaging/macos/README-extension.txt "$STAGE/Browser Extension/How to install.txt"
          rm -f "$DMG"
          hdiutil create -volname "HDM" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          hdiutil imageinfo "$DMG" | head -5
      - name: Portable zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/make-portable.ps1 -Target ${{ matrix.target }}
      - uses: actions/upload-artifact@v5
        with:
          name: hdm-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.exe
            target/${{ matrix.target }}/release/bundle/**/*.msi
            target/${{ matrix.target }}/release/bundle/**/*.deb
            target/${{ matrix.target }}/release/bundle/**/*.rpm
            target/${{ matrix.target }}/release/bundle/**/*.AppImage
            target/${{ matrix.target }}/release/bundle/**/*.dmg
            packaging/out/*.zip
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v5
        if: runner.os == 'Linux'
        with:
          name: hdm-extension
          path: extension/build/*.zip

  publish:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Collect installers and checksums
        run: |
          mkdir -p out
          find artifacts -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.deb' \
            -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.zip' \) -exec cp {} out/ \;
          cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          fail_on_unmatched_files: true
